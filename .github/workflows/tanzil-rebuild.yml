name: SIMORGH Tanzil Direct Rebuild

on:
  workflow_dispatch:

# Default-deny token permissions. Only the final write job gets write access.
permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Rebuild Quran DB directly from Tanzil
        run: python scripts/build_tanzil_quran_db.py --output data/grid/quran.db

      - name: Verify exact Tanzil content
        run: python scripts/verify_tanzil_quran_db.py --db data/grid/quran.db

      - name: Commit rebuilt DB and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grid/quran.db docs/TANZIL_FA_ANSARIAN_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No Tanzil rebuild changes detected."
            exit 0
          fi
          git commit -m "data: rebuild Quran DB from official Tanzil fa.ansarian [tanzil-bot]"
          git push origin HEAD:tanzil-sync

name: Repo Hygiene Guard

on:
  push:
  pull_request:

# Hygiene checks only need read access to repository contents.
permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Block unapproved oversized files
        run: |
          echo "Scanning tracked files for size..."
          big=$(git ls-files -z | xargs -0 -I{} du -b "{}" 2>/dev/null | awk '$1 > 5242880 && $2 != "data/grid/quran.db" && $2 != "data/simorgh_full.db" {print}')
          if [ -n "$big" ]; then
            echo "❌ Files larger than 5MB found outside the approved data assets:"
            echo "$big"
            exit 1
          fi
          echo "✅ No unapproved oversized files."

      - name: Block known junk patterns
        run: |
          junk=$(git ls-files | grep -E '__pycache__|\.pyc$|\.save($|\.[0-9]+$)|\.zip\.[0-9]+$|\.swp$|~$|\.bak[0-9]*$' || true)
          if [ -n "$junk" ]; then
            echo "❌ Junk files tracked in git:"
            echo "$junk"
            exit 1
          fi
          echo "✅ No junk files."

      - name: Block obvious secret patterns
        run: |
          set +e
          hits=$(git grep -nE \
            -e 'gsk_' \
            -e 'sk-[A-Za-z0-9]{20,}' \
            -e "api[_-]?key[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9]{16,}['\"]" \
            -e 'simorgh[0-9]{3}' \
            -- ':!*.md' ':!.github/workflows/*')
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "❌ Secret scan command failed."
            exit "$rc"
          fi
          if [ -n "$hits" ]; then
            echo "❌ Possible secret or insecure default detected:"
            echo "$hits"
            exit 1
          fi
          echo "✅ No obvious secrets or insecure auth defaults."

      - name: Verify strict public surface
        run: python scripts/public_surface_audit.py

      - name: Verify minimal demo
        run: python demo/simorgh_minimal.py --test

      - name: Verify core imports with declared dependencies
        run: |
          python -m pip install -r requirements.txt
          python -c "import main; print('MAIN_IMPORT_PASS')"

      - name: Run tests with pinned dev environment
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONWARNINGS='error::DeprecationWarning,error::PendingDeprecationWarning,error::FutureWarning' PYTHONPATH=. python -m pytest -q

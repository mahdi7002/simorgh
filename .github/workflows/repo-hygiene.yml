name: Repo Hygiene Guard

on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Block unapproved oversized files
        run: |
          echo "Scanning tracked files for size..."
          big=$(git ls-files -z | xargs -0 -I{} du -b "{}" 2>/dev/null | awk '$1 > 5242880 && $2 != "data/grid/quran.db" && $2 != "data/simorgh_full.db" {print}')
          if [ -n "$big" ]; then
            echo "❌ Files larger than 5MB found outside the approved data assets:"
            echo "$big"
            exit 1
          fi
          echo "✅ No unapproved oversized files."

      - name: Block known junk patterns
        run: |
          junk=$(git ls-files | grep -E '__pycache__|\.pyc$|\.save($|\.[0-9]+$)|\.zip\.[0-9]+$|\.swp$|~$|\.bak[0-9]*$' || true)
          if [ -n "$junk" ]; then
            echo "❌ Junk files tracked in git:"
            echo "$junk"
            exit 1
          fi
          echo "✅ No junk files."

      - name: Block obvious secret patterns
        run: |
          set +e
          hits=$(git grep -nE \
            -e 'gsk_' \
            -e 'sk-[A-Za-z0-9]{20,}' \
            -e "api[_-]?key[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9]{16,}['\"]" \
            -e 'simorgh[0-9]{3}' \
            -- ':!*.md' ':!.github/workflows/*')
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "❌ Secret scan command failed."
            exit "$rc"
          fi
          if [ -n "$hits" ]; then
            echo "❌ Possible secret or insecure default detected:"
            echo "$hits"
            exit 1
          fi
          echo "✅ No obvious secrets or insecure auth defaults."

      - name: Verify minimal demo
        run: python3 demo/simorgh_minimal.py --test

      - name: Verify core imports with declared dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -c "import main; print('MAIN_IMPORT_PASS')"

      - name: Run tests
        run: |
          python3 -m pip install pytest httpx
          PYTHONPATH=. pytest -q

name: SIMORGH Global Compliance Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      strict_release:
        description: "Run the strict human release gate"
        required: false
        default: false
        type: boolean

# The audit must never need repository write access.
permissions:
  contents: read

jobs:
  compliance:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install core and compliance tooling
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify core dependency consistency
        run: python -m pip check

      - name: Generate exact core-dependency-closure SPDX SBOM
        run: >-
          python scripts/generate_sbom.py
          --requirements requirements.txt
          --output /tmp/simorgh-sbom-core.spdx.json

      - name: Generate exact content asset manifest
        run: python scripts/generate_asset_manifest.py --output /tmp/simorgh-asset-manifest-core.json

      - name: Audit known Python vulnerabilities
        run: python -m pip_audit --local --strict

      - name: Run core compliance audit with SBOM evidence
        run: python scripts/compliance_gate.py --sbom /tmp/simorgh-sbom-core.spdx.json | tee /tmp/core-compliance-audit.txt

      - name: Install optional dependencies for feature audit
        run: python -m pip install -r requirements-optional.txt

      - name: Verify optional dependency consistency
        run: python -m pip check

      - name: Generate exact optional-dependency-closure SPDX SBOM
        run: >-
          python scripts/generate_sbom.py
          --requirements requirements.txt
          --requirements requirements-optional.txt
          --output /tmp/simorgh-sbom-optional.spdx.json

      - name: Run optional feature compliance audit
        run: python scripts/compliance_gate.py --include-optional --sbom /tmp/simorgh-sbom-optional.spdx.json | tee /tmp/optional-compliance-audit.txt

      - name: Compile source tree
        run: python -m compileall -q .

      - name: Run full regression suite
        run: PYTHONPATH=. python -m pytest -q

      - name: Run strict public surface audit
        run: python scripts/public_surface_audit.py

      - name: Report compliance blockers without hiding them
        shell: bash
        run: |
          set -o pipefail
          for report in /tmp/core-compliance-audit.txt /tmp/optional-compliance-audit.txt; do
            echo "=== $(basename "$report") ==="
            if grep -q '^\[BLOCK\]' "$report"; then
              echo "RELEASE_BLOCKERS_PRESENT=true"
              grep '^\[BLOCK\]' "$report"
            else
              echo "RELEASE_BLOCKERS_PRESENT=false"
            fi
          done
          echo "Normal CI remains green when the repository is technically healthy but intentionally release-blocked by rights/compliance or human-signoff requirements."

      - name: Run strict human release gate when explicitly requested
        if: ${{ inputs.strict_release == true && matrix.python-version == '3.11' }}
        run: |
          python scripts/compliance_gate.py --release --sbom /tmp/simorgh-sbom-core.spdx.json
          echo "STRICT_RELEASE_GATE_PASS"

      - name: Upload audit evidence
        uses: actions/upload-artifact@v6
        with:
          name: compliance-evidence-${{ matrix.python-version }}
          path: |
            /tmp/simorgh-sbom-core.spdx.json
            /tmp/simorgh-sbom-optional.spdx.json
            /tmp/simorgh-asset-manifest-core.json
            /tmp/core-compliance-audit.txt
            /tmp/optional-compliance-audit.txt
          if-no-files-found: error

name: SIMORGH Global Compliance Audit

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_gate:
        description: 'Run the strict human-approved release gate'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run compliance audit
        run: python3 scripts/compliance_gate.py

      - name: Run strict release gate when requested
        if: ${{ inputs.release_gate == true }}
        run: python3 scripts/compliance_gate.py --release

      - name: Compile source tree
        run: python3 -m compileall -q . -x '(^|/)(\.git|\.venv|venv|__pycache__)(/|$)'

      - name: Run full regression suite
        run: PYTHONPATH=. pytest -q

      - name: Generate SPDX SBOM
        run: python3 scripts/generate_sbom.py --output /tmp/simorgh-sbom.spdx.json

      - name: Upload audit SBOM
        uses: actions/upload-artifact@v4
        with:
          name: simorgh-spdx-sbom
          path: /tmp/simorgh-sbom.spdx.json
          if-no-files-found: error

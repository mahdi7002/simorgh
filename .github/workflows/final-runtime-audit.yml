name: SIMORGH Final Runtime Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install core and test/security dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify core dependency consistency
        run: python -m pip check

      - name: Audit known Python vulnerabilities
        run: python -m pip_audit --local --strict

      - name: Compile source
        run: python -m compileall -q .

      - name: Import main with core dependencies only
        run: python -c "import main; print('MAIN_IMPORT_PASS', len(main.app.routes))"

      - name: Import core runtime modules with core dependencies only
        run: |
          python - <<'PY'
          import importlib
          import pathlib

          optional_prefixes = ('core.engine.experimental.',)
          optional_modules = {'core.library_builder'}
          mods=[]
          for p in pathlib.Path('core').rglob('*.py'):
              if p.name.startswith('test_') or p.name.endswith('_test.py'):
                  continue
              mod='.'.join(p.with_suffix('').parts)
              if mod in optional_modules or mod.startswith(optional_prefixes):
                  continue
              mods.append(mod)

          failures=[]
          for mod in sorted(set(mods)):
              try:
                  importlib.import_module(mod)
              except Exception as exc:
                  failures.append((mod,type(exc).__name__,str(exc)))

          print('CORE_RUNTIME_MODULES', len(set(mods)))
          for x in failures:
              print('FAIL', *x)
          raise SystemExit(1 if failures else 0)
          PY

      - name: Minimal demo
        run: python demo/simorgh_minimal.py --test

      - name: Install optional dependencies
        run: python -m pip install -r requirements-optional.txt

      - name: Verify full dependency consistency
        run: python -m pip check

      - name: Import all core modules with optional dependencies
        run: |
          python - <<'PY'
          import importlib
          import pathlib

          mods=[]
          for p in pathlib.Path('core').rglob('*.py'):
              if p.name.startswith('test_') or p.name.endswith('_test.py'):
                  continue
              mods.append('.'.join(p.with_suffix('').parts))

          failures=[]
          for mod in sorted(set(mods)):
              try:
                  importlib.import_module(mod)
              except Exception as exc:
                  failures.append((mod,type(exc).__name__,str(exc)))

          print('ALL_CORE_MODULES', len(set(mods)))
          for x in failures:
              print('FAIL', *x)
          raise SystemExit(1 if failures else 0)
          PY

      - name: Verify Quran DB against official Tanzil translation
        run: python scripts/verify_tanzil_quran_db.py

      - name: Regression tests with pytest warning policy
        run: PYTHONPATH=. python -m pytest -q

      - name: Database integrity
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          dbs=list(Path('.').rglob('*.db'))
          bad=0
          for p in dbs:
              with sqlite3.connect(f'file:{p}?mode=ro', uri=True) as c:
                  result=c.execute('PRAGMA integrity_check').fetchone()[0]
                  print(f'DB {p} integrity={result} size={p.stat().st_size}')
                  bad += result != 'ok'
          raise SystemExit(1 if bad else 0)
          PY

      - name: Generate exact core SBOM and compliance evidence
        run: |
          python scripts/generate_sbom.py --requirements requirements.txt --output /tmp/simorgh-sbom.spdx.json
          python scripts/generate_asset_manifest.py --output /tmp/simorgh-asset-manifest.json
          python scripts/compliance_gate.py --sbom /tmp/simorgh-sbom.spdx.json

      - name: Strict public surface audit
        run: python scripts/public_surface_audit.py

      - name: API smoke
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import main
          c=TestClient(main.app)
          assert c.get('/health').status_code == 200
          assert c.get('/dashboard/').status_code == 200
          assert c.get('/personas').status_code == 200
          print('API_SMOKE_PASS')
          PY
